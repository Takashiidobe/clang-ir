name: Release

on:
  push:
    tags:
      - "*-clang-ir"
      - "*-clang-ir-types"

jobs:
  publish-types:
    if: endsWith(github.ref_name, '-clang-ir-types')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches clang-ir-types version
        run: |
          tag_version="${GITHUB_REF_NAME%-clang-ir-types}"
          crate_version="$(cd clang-ir-types && cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clang-ir-types") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match clang-ir-types Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish clang-ir-types
        working-directory: clang-ir-types
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-clang-ir:
    needs: publish-types
    if: ${{ !cancelled() && endsWith(github.ref_name, '-clang-ir') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and published version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME%-clang-ir}"
          crate_version="$(cd clang-ir && cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clang-ir") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match clang-ir Cargo.toml version $crate_version" >&2
            exit 1
          fi

          encoded_version="$(jq -rn --arg v "$crate_version" '$v|@uri')"
          status="$(curl -A "clang-ir-release-workflow" --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/clang-ir/$encoded_version")"
          if [ "$status" = "200" ]; then
            echo "clang-ir $crate_version already exists on crates.io; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "clang-ir $crate_version has not been published yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response while checking clang-ir $crate_version: HTTP $status" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.skip != 'true'

      - name: Publish clang-ir
        if: steps.version.outputs.skip != 'true'
        working-directory: clang-ir
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

name: Release

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate versions
        id: versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          types_version="$(cd clang-ir-types && cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clang-ir-types") | .version')"
          clang_ir_version="$(cd clang-ir && cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clang-ir") | .version')"
          if [ "$release_version" != "$clang_ir_version" ]; then
            echo "Tag $RELEASE_TAG does not match clang-ir version $clang_ir_version" >&2
            exit 1
          fi
          case "$types_version" in
            "$release_version"-*) ;;
            *)
              echo "clang-ir-types version $types_version does not use parent version $release_version" >&2
              exit 1
              ;;
          esac
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "types_version=$types_version" >> "$GITHUB_OUTPUT"

      - name: Check whether clang-ir-types is already published
        id: types_version
        env:
          TYPES_VERSION: ${{ steps.versions.outputs.types_version }}
        run: |
          status="$(curl --user-agent "clang-ir-release-workflow" --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/clang-ir-types/$TYPES_VERSION")"
          if [ "$status" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response for clang-ir-types $TYPES_VERSION: HTTP $status" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish clang-ir-types
        if: steps.types_version.outputs.skip != 'true'
        working-directory: clang-ir-types
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for clang-ir-types on crates.io
        env:
          TYPES_VERSION: ${{ steps.versions.outputs.types_version }}
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --user-agent "clang-ir-release-workflow" --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/clang-ir-types/$TYPES_VERSION")"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "clang-ir-types $TYPES_VERSION did not become available on crates.io after $attempt checks" >&2
          exit 1

      - name: Check whether clang-ir is already published
        id: clang_ir_version
        env:
          CLANG_IR_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          status="$(curl --user-agent "clang-ir-release-workflow" --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/clang-ir/$CLANG_IR_VERSION")"
          if [ "$status" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response for clang-ir $CLANG_IR_VERSION: HTTP $status" >&2
            exit 1
          fi

      - name: Publish clang-ir
        if: steps.clang_ir_version.outputs.skip != 'true'
        working-directory: clang-ir
        run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

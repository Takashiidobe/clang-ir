[package]
name = "clang-ir"
version = "0.1.4"
edition = "2024"
description = "Parser for Clang IR (CIR) textual output into a generic, dialect-agnostic operation tree"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Takashiidobe/clang-ir"
readme = "README.md"
keywords = ["clang", "cir", "mlir", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]
exclude = ["/tests"]

[dependencies]
clang-ir-types = { version = ">=0.1.4-0, <0.1.5", path = "../clang-ir-types" }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
insta = "1"

[features]
serde = ["dep:serde", "clang-ir-types/serde"]

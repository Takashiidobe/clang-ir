[package]
name = "clang-ir-types-gen"
version = "0.1.3"
edition = "2024"

[dependencies]
heck = "0.5"
prettyplease = "0.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3", features = ["full"] }
tblgen = { version = "0.9.1", git = "https://github.com/takashiidobe/tblgen-rs", branch = "llvm-24-support", features = [
  "llvm24-0",
] }

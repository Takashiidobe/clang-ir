[package]
name = "clang-ir-types"
version = "0.1.2"
edition = "2024"
description = "Generated Clang IR (CIR) types and operation model"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Takashiidobe/clang-ir"
readme = "README.md"
keywords = ["clang", "cir", "mlir", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]
exclude = ["/tests"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
